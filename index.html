<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="previewcardstyles.css" />
    <title>Frontend Mentor | Stats preview card component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 
     
    -->
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="preview-card">
        <div class="left-column">
          <div class="left-box">
            <div>
              <p class="main-heading">
                Get <span class="purple-text">insights</span> that help your
                business grow.
              </p>
            </div>
          </div>
          <div class="left-box">
            <div>
              <p class="main-paragraph">
                Discover the benefits of data analytics and make better
                decisions regarding revenue, customer experience, and overall
                efficiency.
              </p>
            </div>
          </div>
          <div class="left-box stat-grid">
            <div class="stat-box">
              <p class="stat">10k+</p>
              <p class="stat-description">companies</p>
            </div>
            <div class="stat-box">
              <p class="stat">314</p>
              <p class="stat-description">templates</p>
            </div>
            <div class="stat-box">
              <p class="stat">12M+</p>
              <p class="stat-description">queries</p>
            </div>
          </div>
        </div>
        <div class="right-column">
          <div class="right-box">
            <div class="image-container">
              <img
                class="image-women"
                src="images/image-header-desktop.jpg"
                alt="Women laughing at a office work space, black and white image hued purple."
              />
            </div>
          </div>
        </div>
      </div>
      <div class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >. Coded by <a href="#">A. Swingle</a>.
      </div>
    </div>
  </body>
</html>
